apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      initContainers:
        - name: wait-for-ssh-keys
          image: "{{ .Values.initContainer.image.repository }}:{{ .Values.initContainer.image.tag }}"
          command: ["sh", "-c"]
          args:
            - |
              for i in $(seq 1 60); do
                if [ -f /ssh-keys/ssh_host_ed25519_key ]; then
                  exit 0
                fi
                echo "Waiting for SSH host keys Secret..."
                sleep 2
              done
              echo "SSH host keys Secret not found!" >&2
              exit 1
          volumeMounts:
            - name: ssh-ed25519-key
              mountPath: /ssh-keys
        - name: copy-ssh-keys
          image: "{{ .Values.initContainer.image.repository }}:{{ .Values.initContainer.image.tag }}"
          command: ["sh", "-c"]
          args:
            - |
              cp /ssh-keys/ssh_host_ed25519_key /ssh-writable/ && \
              cp /ssh-keys/ssh_host_ed25519_key.pub /ssh-writable/ && \
              chmod 600 /ssh-writable/ssh_host_ed25519_key && \
              chmod 644 /ssh-writable/ssh_host_ed25519_key.pub
          volumeMounts:
            - name: ssh-ed25519-key
              mountPath: /ssh-keys
            - name: ssh-writable
              mountPath: /ssh-writable
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: INTERNAL_LINUX_SSH_PORT
              value: "{{ .Values.internalLinux.sshPort }}"
            - name: INTERNAL_LINUX_SSH_JENKINS_USERNAME
              value: "{{ .Values.internalLinux.sshJenkinsUsername }}"
          ports:
            - containerPort: {{ .Values.internalLinux.sshPort }}
          volumeMounts:
            - name: ssh-writable
              mountPath: /etc/ssh/ssh_host_ed25519_key
              subPath: ssh_host_ed25519_key
              readOnly: true
            - name: ssh-writable
              mountPath: /etc/ssh/ssh_host_ed25519_key.pub
              subPath: ssh_host_ed25519_key.pub
              readOnly: true
            - name: jenkins-public-key
              mountPath: /jenkins-public-key
              readOnly: true
      volumes:
        - name: ssh-ed25519-key
          secret:
            secretName: {{ .Values.internalLinux.sshKeySecretName }}
        - name: ssh-writable
          emptyDir: {}
        - name: jenkins-public-key
          secret:
            secretName: {{ .Values.internalLinux.jenkinsPublicKeySecretName }}