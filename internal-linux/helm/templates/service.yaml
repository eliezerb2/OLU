apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.internalLinux.ssh.port }}
      targetPort: {{ .Values.internalLinux.ssh.port }}
      protocol: TCP
      name: ssh
  selector:
    app: {{ .Release.Name }}