replicaCount: 1
image:
  repository: jenkins-controller
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: NodePort
  port: 8080
  nodePort: 32008
persistence:
  enabled: true
  storageClass: local-path
  accessMode: ReadWriteOnce
  size: 8Gi
resources: {}
configMap:
  name: "config"
jenkins:
  homePath: /var/jenkins_home
  sshFolderName: .ssh
interfaces:
  internalLinux:
    name: "interface-jenkins-internal-linux"
  updatesDownloader:
    name: "interface-jenkins-updates-downloader"
adminUser:
  name: "admin"
adminPassword:
  secretName: admin-password
  keyName: password 