replicaCount: 1
image:
  repository: jenkins-controller
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: NodePort
  port: 8080
  nodePort: 32008
persistence:
  enabled: true
  storageClass: local-path
  accessMode: ReadWriteOnce
  size: 8Gi
adminPassword: "admin"
resources: {}
configMap:
  name: "config"
jenkins:
  homePath: /var/jenkins_home
  sshFolderName: .ssh
env1:
  - name: ADMIN_USER
    value: "admin"
  - name: ADMIN_PASSWORD
    value: "newpassword"
updatesDownloader:
  sshPort: 2222
  sshJenkinsUsername: jenkins
  sshKeySecretName: updates-downloader-ssh-host-keys
  jenkinsPrivateKeySecretName: jenkins-ssh-private-key
  jenkinsPublicKeySecretName: jenkins-ssh-public-key
  knownHostsSecretName: updates-downloader-known-hosts
interfaces:
  internalLinux:
    name: "interface-jenkins-internal-linux"