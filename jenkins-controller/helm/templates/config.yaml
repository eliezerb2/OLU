apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "configMapName" . }}
  labels:
    app: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-50"
data:
  LOG_LEVEL: "DEBUG"
  SSH_FOLDER_PATH: {{ include "sshFolderPath" . | quote }}
  INTERNAL_LINUX_KEY_FILE_PATH: {{ include "internal-linux.ssh.host-key-file-path" . | quote }}