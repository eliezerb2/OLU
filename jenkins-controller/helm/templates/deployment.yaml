apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: jenkins
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: JENKINS_ADMIN_ID
              value: "admin"
            - name: JENKINS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-admin
                  key: password
            {{- range .Values.env0 }}
            - name: {{ .name | quote }}
              value: {{ .value | quote }}
            {{- end }}
            {{- range .Values.env1 }}
            - name: {{ .name | quote }}
              value: {{ .value | quote }}
            {{- end }}          
            - name: UPDATES_DOWNLOADER_SSH_JENKINS_USERNAME
              value: "{{ .Values.updatesDownloader.sshJenkinsUsername }}"
            - name: INTERNAL_LINUX_SSH_JENKINS_USERNAME
              value: "{{ .Values.internalLinux.sshJenkinsUsername }}"
          volumeMounts:
            - name: jenkins-home
              mountPath: /var/jenkins_home
      initContainers:
        - name: setup-ssh
          image: "{{ .Values.initContainer.image.repository }}:{{ .Values.initContainer.image.tag }}"
          command: ["sh", "-c"]
          args:
            - |
              # Remove any existing SSH keys
              rm -rf /var/jenkins_home/.ssh
              
              mkdir -p /var/jenkins_home/.ssh
              chmod 700 /var/jenkins_home/.ssh
              
              # Copy SSH keys with proper permissions
              cp /updates-downloader-ssh-key/id_ed25519 /var/jenkins_home/.ssh/updates_downloader_id_ed25519
              chmod 600 /var/jenkins_home/.ssh/updates_downloader_id_ed25519
              
              cp /internal-linux-ssh-key/id_ed25519 /var/jenkins_home/.ssh/internal_linux_id_ed25519
              chmod 600 /var/jenkins_home/.ssh/internal_linux_id_ed25519
              
              # Copy known_hosts with proper permissions
              cp /updates-downloader-known-hosts/known_hosts /var/jenkins_home/.ssh/updates_downloader_known_hosts
              chmod 644 /var/jenkins_home/.ssh/updates_downloader_known_hosts
              
              cp /internal-linux-known-hosts/known_hosts /var/jenkins_home/.ssh/internal_linux_known_hosts
              chmod 644 /var/jenkins_home/.ssh/internal_linux_known_hosts
              
              # Create SSH config
              echo "Host updates-downloader" > /var/jenkins_home/.ssh/config
              echo "  HostName updates-downloader" >> /var/jenkins_home/.ssh/config
              echo "  Port {{ .Values.updatesDownloader.sshPort }}" >> /var/jenkins_home/.ssh/config
              echo "  User {{ .Values.updatesDownloader.sshJenkinsUsername }}" >> /var/jenkins_home/.ssh/config
              echo "  IdentityFile /var/jenkins_home/.ssh/updates_downloader_id_ed25519" >> /var/jenkins_home/.ssh/config
              echo "  UserKnownHostsFile /var/jenkins_home/.ssh/updates_downloader_known_hosts" >> /var/jenkins_home/.ssh/config
              echo "  StrictHostKeyChecking yes" >> /var/jenkins_home/.ssh/config
              echo "" >> /var/jenkins_home/.ssh/config
              echo "Host internal-linux" >> /var/jenkins_home/.ssh/config
              echo "  HostName internal-linux" >> /var/jenkins_home/.ssh/config
              echo "  Port {{ .Values.internalLinux.sshPort }}" >> /var/jenkins_home/.ssh/config
              echo "  User {{ .Values.internalLinux.sshJenkinsUsername }}" >> /var/jenkins_home/.ssh/config
              echo "  IdentityFile /var/jenkins_home/.ssh/internal_linux_id_ed25519" >> /var/jenkins_home/.ssh/config
              echo "  UserKnownHostsFile /var/jenkins_home/.ssh/internal_linux_known_hosts" >> /var/jenkins_home/.ssh/config
              echo "  StrictHostKeyChecking yes" >> /var/jenkins_home/.ssh/config
              chmod 600 /var/jenkins_home/.ssh/config
              
              # Set proper ownership for all files
              chown -R 1000:1000 /var/jenkins_home/.ssh
          volumeMounts:
            - name: jenkins-home
              mountPath: /var/jenkins_home
            - name: updates-downloader-ssh-key
              mountPath: /updates-downloader-ssh-key
              readOnly: true
            - name: updates-downloader-known-hosts
              mountPath: /updates-downloader-known-hosts
              readOnly: true
            - name: internal-linux-ssh-key
              mountPath: /internal-linux-ssh-key
              readOnly: true
            - name: internal-linux-known-hosts
              mountPath: /internal-linux-known-hosts
              readOnly: true
      volumes:
        - name: updates-downloader-ssh-key
          secret:
            secretName: {{ .Values.updatesDownloader.jenkinsPrivateKeySecretName }}
            defaultMode: 0600
        - name: updates-downloader-known-hosts
          secret:
            secretName: {{ .Values.updatesDownloader.knownHostsSecretName }}
            defaultMode: 0644
        - name: internal-linux-ssh-key
          secret:
            secretName: {{ .Values.internalLinux.jenkinsPrivateKeySecretName }}
            defaultMode: 0600
        - name: internal-linux-known-hosts
          secret:
            secretName: {{ .Values.internalLinux.knownHostsSecretName }}
            defaultMode: 0644
        - name: jenkins-home
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-pvc