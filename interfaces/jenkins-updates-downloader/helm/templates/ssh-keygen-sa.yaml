apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sshKeygenServiceAccountName" . }}
  labels:
    {{- include "interface.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "-40"