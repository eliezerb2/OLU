apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "configMapName" . }}
  labels:
    {{- include "interface.labels" . | nindent 4 }}
    protocol: ssh
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-50"
data:
  LOG_LEVEL: "DEBUG"
  INTERNAL_LINUX_SSH_PORT: "{{ .Values.internalLinux.ssh.port }}"
  INTERNAL_LINUX_SSH_JENKINS_USERNAME: "{{ .Values.internalLinux.ssh.jenkinsUsername }}"
  SSH_HOST_KEY_PATH: {{ include "sshHostKeyPath" (dict "path" .Values.internalLinux.ssh.hostKeyPath) | quote }}
  SSH_HOST_KEY_PUB_PATH: {{ include "sshHostKeyPubPath" (dict "path" .Values.internalLinux.ssh.hostKeyPath) | quote }}
  SSH_KEY_ALGORITHM: "{{ .Values.internalLinux.ssh.hostKeyPath.algorithm }}"
  INTERNAL_LINUX_SSH_PUBLIC_KEY_SECRET: {{ .Release.Name }}-{{ .Values.internalLinux.ssh.publicKeySecretName }}
