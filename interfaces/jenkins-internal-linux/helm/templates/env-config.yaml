apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-{{ include "get.filename" . }}
  labels:
    {{- include "interface.labels" . | nindent 4 }}
    protocol: ssh
data:
  LOG_LEVEL: "DEBUG"
  INTERNAL_LINUX_SSH_PORT: "{{ .Values.internalLinux.ssh.port }}"
  INTERNAL_LINUX_SSH_JENKINS_USERNAME: "{{ .Values.internalLinux.ssh.jenkinsUsername }}"
  SSH_HOST_KEY_PATH: {{ .Values.internalLinux.ssh.hostKeyPath }}