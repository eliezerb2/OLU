apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-{{ include "get.filename" . }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      initContainers:
        - name: copy-ssh-keys
          image: "{{ include "initContainerImage" . }}"
          command: ["sh", "-c"]
          # TODO: convert this to a set of scripts
          # TODO: parameterize the algorithm
          args:
            - |
              cp /ssh-keys/ssh_host_ed25519_key /ssh-writable/ && \
              cp /ssh-keys/ssh_host_ed25519_key.pub /ssh-writable/ && \
              chmod 600 /ssh-writable/ssh_host_ed25519_key && \
              chmod 644 /ssh-writable/ssh_host_ed25519_key.pub
          volumeMounts:
            - name: ssh-ed25519-key
              mountPath: /ssh-keys
            - name: ssh-writable
              mountPath: /ssh-writable
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ .Values.interfaces.jenkins.name }}-config
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          ports:
            - containerPort: {{ .Values.updatesDownloader.ssh.port }}
          # TODO: do we need these environment variables?
          env:
            {{- range .Values.env0 }}
            - name: {{ .name | quote }}
              value: {{ .value | quote }}
            {{- end }}
            {{- range .Values.env1 }}
            - name: {{ .name | quote }}
              value: {{ .value | quote }}
            {{- end }}
          volumeMounts:
            - name: ssh-writable
              mountPath: {{ include "sshHostKeyPath" (dict "path" .Values.updatesDownloader.ssh.hostKeyPath) | quote }}
              subPath: {{ include "sshHostKeyFileName" (dict "path" .Values.updatesDownloader.ssh.hostKeyPath) | quote }}
              readOnly: true
            - name: ssh-writable
              mountPath: {{ include "sshHostKeyPubPath" (dict "path" .Values.updatesDownloader.ssh.hostKeyPath) | quote }}
              subPath: {{ include "sshHostKeyPubFileName" (dict "path" .Values.updatesDownloader.ssh.hostKeyPath) | quote }}
              readOnly: true
            - name: jenkins-public-key
              mountPath: /jenkins-public-key
              readOnly: true
      volumes:
        - name: ssh-ed25519-key
          secret:
            secretName: {{ .Values.interfaces.jenkins.name }}-{{ .Values.updatesDownloader.ssh.keySecretName }}
        - name: ssh-writable
          emptyDir: {}
        - name: jenkins-public-key
          secret:
            secretName: {{ .Values.interfaces.jenkins.name }}-{{ .Values.updatesDownloader.ssh.publicKeySecretName }}