apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: {{ .Values.sshKeygenJob.name }}
    namespace: default
    labels:
        app: {{ .Release.Name }}
    annotations:
        "helm.sh/hook": pre-install,pre-upgrade
        "helm.sh/hook-weight": "-30"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
