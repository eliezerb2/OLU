apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-generate-ssh-keys
  labels:
    app: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "-10"
spec:
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Values.sshKeygenJob.name }}
      restartPolicy: OnFailure
      containers:
        - name: ssh-keygen
          image: "{{ .Values.sshKeygenJob.image.repository }}:{{ .Values.sshKeygenJob.image.tag }}"
          imagePullPolicy: {{ .Values.sshKeygenJob.image.imagePullPolicy}}
          command: ["sh", "-c"]
          args:
            - |
              set -e
              # Create the Jenkins SSH user and home if not present
              id {{ .Values.updatesDownloader.sshJenkinsUsername }} 2>/dev/null || useradd -m -s /bin/sh {{ .Values.updatesDownloader.sshJenkinsUsername }}
              mkdir -p /home/{{ .Values.updatesDownloader.sshJenkinsUsername }}/.ssh
              chown -R {{ .Values.updatesDownloader.sshJenkinsUsername }}: /home/{{ .Values.updatesDownloader.sshJenkinsUsername }}
              chmod 700 /home/{{ .Values.updatesDownloader.sshJenkinsUsername }}/.ssh
              # Generate SSH host keys
              mkdir -p /etc/ssh
              ssh-keygen -A
              # Generate Jenkins user keypair
              ssh-keygen -t ed25519 -f /tmp/jenkins_id_ed25519 -N ""
              # Always delete and recreate Secrets to ensure sync
              kubectl delete secret {{ .Values.updatesDownloader.sshKeySecretName }} --ignore-not-found
              kubectl delete secret {{ .Values.updatesDownloader.jenkinsPrivateKeySecretName }} --ignore-not-found
              kubectl delete secret {{ .Values.updatesDownloader.jenkinsPublicKeySecretName }} --ignore-not-found
              # Create Secret for SSH host keys
              kubectl create secret generic {{ .Values.updatesDownloader.sshKeySecretName }} \
                --from-file=ssh_host_ed25519_key=/etc/ssh/ssh_host_ed25519_key \
                --from-file=ssh_host_ed25519_key.pub=/etc/ssh/ssh_host_ed25519_key.pub \
                --dry-run=client -o yaml | kubectl apply -f -
              # Create Secret for Jenkins private key
              kubectl create secret generic {{ .Values.updatesDownloader.jenkinsPrivateKeySecretName }} \
                --from-file=id_ed25519=/tmp/jenkins_id_ed25519 \
                --dry-run=client -o yaml | kubectl apply -f -
              # Create Secret for Jenkins public key (as authorized_keys)
              cp /tmp/jenkins_id_ed25519.pub /home/{{ .Values.updatesDownloader.sshJenkinsUsername }}/.ssh/authorized_keys
              chown {{ .Values.updatesDownloader.sshJenkinsUsername }}: /home/{{ .Values.updatesDownloader.sshJenkinsUsername }}/.ssh/authorized_keys
              chmod 600 /home/{{ .Values.updatesDownloader.sshJenkinsUsername }}/.ssh/authorized_keys
              kubectl create secret generic {{ .Values.updatesDownloader.jenkinsPublicKeySecretName }} \
                --from-file=authorized_keys=/home/{{ .Values.updatesDownloader.sshJenkinsUsername }}/.ssh/authorized_keys \
                --dry-run=client -o yaml | kubectl apply -f -
              # Clean up
              rm -f /tmp/jenkins_id_ed25519 /home/{{ .Values.updatesDownloader.sshJenkinsUsername }}/.ssh/authorized_keys
